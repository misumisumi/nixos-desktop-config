[apps.users.sumi]

[apps.users.sumi.delta]
[apps.users.sumi.delta.git]
[apps.users.sumi.delta.git.core]
paper = "delta"
[apps.users.sumi.delta.git.interactive]
diffFilter = "delta --color-only"
[apps.users.sumi.delta.git.delta]

[apps.users.sumi.git]
[apps.users.sumi.git.core]
fileMode = false
[apps.users.sumi.git.settings.user]
email = "s.kobayashi@misumi-sumi.com"
name = "misumisumi"
[apps.users.sumi.git.settings.alias]
tree = "log --graph --oneline --decorate --all"                                                          # logのツリー表示
co-fixup = "commit --fixup"
push-f = "push --force-with-lease"                                                                       # pushの強制 (ローカルが最新で無い場合失敗する)
rebase-i = "rebase -i --autosquash"                                                                      #
branch-clear = "!git branch --merged origin/HEAD | grep -vE '(HEAD|main|master)$' | xargs git branch -d"
rebase-origin = "!git fetch origin --prune && git rebase origin/HEAD"
[apps.users.sumi.git.signing]
key = "2C0E62B7117471A5"
format = "openpgp"
signByDefault = false

[apps.users.sumi.lazygit]
paper = "delta --paging=never"

[apps.users.sumi.opencode]
plugins = ["opencode-plugin-litellm@latest"]
[apps.users.sumi.opencode.theme]
name = "tokyonight"
mode = "dark"
[apps.users.sumi.opencode.providers.litellm]
name = "LiteLLM"
package = "@opencode/ai/providers/openai-compatible"
[apps.users.sumi.opencode.providers.litellm.settings]
baseURL = "https://llm.misumi-sumi.com/v1"
apiKey = "{env:LITELLM_API_KEY}"
timeout = false
chunkTimeout = false
formatModelNames = false
[apps.users.sumi.opencode.providers.litellm.headers]
CF-Access-Client-Id = "{env:CF_ACCESS_CLIENT_ID}"
CF-Access-Client-Secret = "{env:CF_ACCESS_SECRET}"
[[apps.users.sumi.opencode.permissions]]
action = "edit"
resource = "*"
effect = "allow"
[[apps.users.sumi.opencode.permissions]]
action = "glob"
resource = "*"
effect = "allow"
[[apps.users.sumi.opencode.permissions]]
action = "grep"
resource = "*"
effect = "allow"
[[apps.users.sumi.opencode.permissions]]
action = "question"
resource = "*"
effect = "allow"
[[apps.users.sumi.opencode.permissions]]
action = "read"
resource = "*"
effect = "allow"
[[apps.users.sumi.opencode.permissions]]
action = "skill"
resource = "*"
effect = "allow"
[[apps.users.sumi.opencode.permissions]]
action = "webfetch"
resource = "*"
effect = "allow"
[[apps.users.sumi.opencode.permissions]]
action = "websearch"
resource = "*"
effect = "allow"

# omo (oh-my-openagent) settings
# litellm の combo alias を category / agent に割り当てる
# main は agent combo を廃止し GLM-5.2 を直接ピン留め
[apps.users.sumi.omo.agent.settings]
defaultProvider = "litellm"
defaultModel = "glm-5.2"

[apps.users.sumi.omo.settings]
model_profile = "litellm/glm-5.2"
exclude_models = [
    "anthropic/claude-fable-5-1",
    "anthropic/claude-opus-5-5",
    "anthropic/claude-opus-4-6",
    "openai/gpt-6-astra",
    "openai/gpt-6-sol",
    "openai/gpt-6.1-sol",
    "openai/gpt-6.1-sol-fast",
]

# ── main (native harness: 新規セッション時に適用。TUI では /model litellm/glm-5.2)──
[[apps.users.sumi.omo.settings.model_profiles."daily-normal".models]]
model = "litellm/glm-5.2"
reasoning = "medium"
[[apps.users.sumi.omo.settings.model_profiles."daily-normal".models]]
model = "litellm/superbrain"
reasoning = "max"

# ── category (委派ピラミッド。omo-native の reviewer 3 体はここを自動継承)──
[apps.users.sumi.omo.settings.categories.quick]
models = ["litellm/quick"]
[apps.users.sumi.omo.settings.categories."unspecified-low"]
models = ["litellm/auto"] # Jev 裁定プール
[apps.users.sumi.omo.settings.categories."unspecified-high"]
models = ["litellm/superbrain", "litellm/complex"]
[apps.users.sumi.omo.settings.categories."deep-low"]
models = ["litellm/coding"] # → qa-executor が自動追従
[apps.users.sumi.omo.settings.categories."deep-high"]
models = [
    "litellm/superbrain",
    "litellm/ultrabrain",
] # gate-reviewer は先頭 superbrain、難案件は sonnet へ二段昇格
[apps.users.sumi.omo.settings.categories.ultrabrain]
models = ["litellm/ultrabrain"] # Sonnet → K3.1 Pro → local
[apps.users.sumi.omo.settings.categories."visual-engineering"]
models = ["litellm/coding"]
[apps.users.sumi.omo.settings.categories.writing]
models = ["litellm/writing"]
[apps.users.sumi.omo.settings.categories.artistry]
models = ["litellm/ultrabrain"]
[apps.users.sumi.omo.settings.categories.architect]
models = ["litellm/ultrabrain"]

# ── 名前付きエージェント ──
[apps.users.sumi.omo.settings.agents.sisyphus]
prompt_append = "You NEVER implement. Route ALL code changes through task(category=...). Self-edit only single-line typos."
[apps.users.sumi.omo.settings.agents.explore]
model = "litellm/coding"
[apps.users.sumi.omo.settings.agents.librarian]
model = "litellm/coding"
[apps.users.sumi.omo.settings.agents."plan-consultant"]
model = "litellm/ultrabrain"
[apps.users.sumi.omo.settings.agents."plan-reviewer"]
model = "litellm/reviewer" # Sol high (初回 + 最大 2 ラウンド)

# omo (senpi engine) provider catalogue -> ~/.omo.settings/agent/models.json
# omo native は opencode の providers 設定を読まないため、LiteLLM をここで定義する
[apps.users.sumi.omo.settings_models.providers.litellm]
name = "LiteLLM"
baseUrl = "https://llm.misumi-sumi.com/v1"
api = "openai-completions"
apiKey = "${LITELLM_API_KEY}"
[apps.users.sumi.omo.settings_models.providers.litellm.compat]
supportsReasoningEffort = true
[apps.users.sumi.omo.settings_models.providers.litellm.headers]
CF-Access-Client-Id = "${CF_ACCESS_CLIENT_ID}"
CF-Access-Client-Secret = "${CF_ACCESS_SECRET}"

[[apps.users.sumi.omo.settings_models.providers.litellm.models]]
