####################################################################################################
# For linux
####################################################################################################
[linux.users.ach18207ao]
externals = ["blesh", "fzf-options", "lesspipe", "tpm"]
[linux.users.ach18207ao.sops]
"pkgs/ai-tools/env" = ".env"

[linux.users.ach18207ao.env]
initExtra = ""
extraConfig = """
if [ "$SHELL" != "/usr/bin/zsh" ] && [ "${LOGIN:-1}" -eq 1 ]; then
  exec /usr/bin/zsh -l
fi
"""
PATH = ["$HOME/bin", "$HOME/.local/bin"]

[linux.users.ach18207ao.env.export]
EDITOR = "nvim"
FZF_ALT_C_COMMAND = "fd --type d"
FZF_ALT_C_OPTS = "--preview 'tree -C {} | tree -200'"
FZF_CTRL_R_OPTS = "--preview 'echo {}' --preview-window up:3:hidden:wrap --bind 'ctrl-/:toggle-preview' --bind 'ctrl-y:execute-silent(echo -n {2..} | pbcopy)+abort' --color header:italic --header 'Press CTRL-Y to copy command into clipboard'"
FZF_CTRL_T_COMMAND = "fd --type f"
FZF_CTRL_T_OPTS = "--preview 'bat -n --color: always {}' --bind 'ctrl-/:change-preview-window(down|hidden|)'"
FZF_TMUX = "1"
FZF_TMUX_OPTS = "-p -w 80% -h 70%"
JQ_COLORS = "1;30:0;37:0;37:0;37:0;32:1;37:1;37"
LG_CONFIG_FILE = "$XDG_CONFIG_HOME/lazygit/config.yml"
MANPAGER = "sh -c 'sed -u -e \\\"s%\\\\x1B\\[[0-9;]*m%%g; s%.\\\\x08%%g\\\" | bat -p -lman'"
TMUX_TMPDIR = "${XDG_RUNTIME_DIR:-/run/user/$(id -u)}"
LESSOPEN = "|lesspipe %s"
LANG = "en-US.UTF-8"
LANGUAGE = "en_US"
LC_ALL = "en_US.UTF-8"

[linux.users.ach18207ao.env.alias]
copilot = "wrapEnv copilot"
mcp-hub = "wrapEnv mcp-hub"
opencode = "wrapEnv opencode"

[linux.users.ach18207ao.packages.mise.settings]
idiomatic_version_file = true
download_cache = false
always_keep_install = false
verbose = false
http_timeout = "30s"
jobs = 4
raw = false
yes = false
not_found_auto_install = true
auto_install = true
experimental = true
idiomatic_version_file_enable_tools = []
[linux.users.ach18207ao.packages.mise.tool_update]
check_duration = "7d"
# mcp servers migrated from packages.mcpServers: alias name = backend identifier, alias name is executable name
[linux.users.ach18207ao.packages.mise.tool_alias]
context7-mcp = "npm:@upstash/context7-mcp"
mcp-hub = "npm:mcp-hub"
mcp-nixos = "pypi:mcp-nixos"
mcp-server-git = "pypi:mcp-server-git"
paper-search-mcp = "pypi:git+https://github.com/openags/paper-search-mcp.git"
github-mcp-server = "github:github/github-mcp-server"
codebase-memory-mcp = "pypi:codebase-memory-mcp"
[linux.users.ach18207ao.packages.mise.tools]
bat = "latest"
btop = "latest"
clang = "latest"
cmake = "latest"
codebase-memory-mcp = "latest"
context7-mcp = "latest"
copilot = "latest"
delta = "latest"
deno = "latest"
duf = "latest"
fd = "latest"
fzf = "latest"
github-cli = "latest"
github-mcp-server = "latest"
go = "latest"
jq = "latest"
lazygit = "latest"
mcp-hub = "latest"
mcp-nixos = "latest"
mcp-server-git = "latest"
neovim = "latest"
node = "latest"
opencode = "latest"
