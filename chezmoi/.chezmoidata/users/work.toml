python = "latest"
ripgrep = "latest"
rust = "latest"
sops = "latest"
starship = "latest"
tmux = "latest"
tree-sitter = "latest"
usage = "latest"
uv = "latest"
yazi = "latest"
yt-dlp = "latest"
